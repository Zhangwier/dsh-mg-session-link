name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
        env:
          NO_COLOR: '1'

      - name: Check every source file parses
        run: |
          for f in lib/*.js tools/*.mjs tools/*.js; do
            node --check "$f" || exit 1
          done
